const toISODate = (date) => {
  const copy = new Date(date);
  copy.setMinutes(copy.getMinutes() - copy.getTimezoneOffset());
  return copy.toISOString().slice(0, 10);
};

const getWeek = () => {
  const today = new Date();
  const day = today.getDay() || 7;
  const monday = new Date(today);
  monday.setDate(today.getDate() - day + 1);

  return Array.from({ length: 7 }, (_, index) => {
    const date = new Date(monday);
    date.setDate(monday.getDate() + index);
    return {
      date: toISODate(date),
      label: ruDay.format(date).replace('.', ''),
      short: ruShortDate.format(date),
    };
  });
};

const money = (value) =>
  `${new Intl.NumberFormat('ru-KZ', {
    maximumFractionDigits: 0,
  }).format(Number(value) || 0)} ₸`;

const numberValue = (value) => Number(value) || 0;

const percent = (value) => `${Number.isFinite(value) ? value.toFixed(1) : '0.0'}%`;

const metricMoney = (value) => money(Math.round(Number.isFinite(value) ? value : 0));

const normalizePercent = (value) => {
  const numeric = numberValue(value);
  if (!numeric) return 0;
  return numeric > 1 ? numeric / 100 : numeric;
};

const daysLeftInMonth = (date = new Date()) => {
  const year = date.getFullYear();
  const month = date.getMonth();
  const lastDay = new Date(year, month + 1, 0).getDate();
  return Math.max(1, lastDay - date.getDate() + 1);
};

const calculateProjectMetrics = (project) => {
  const spent = numberValue(project.spent || project.budget);
  const impressions = numberValue(project.impressions);
  const clicks = numberValue(project.clicks);
  const leads = numberValue(project.leads);
  const revenue = numberValue(project.revenue);
  const hasRevenue = project.revenue !== undefined && project.revenue !== '';

  return {
    ctr: impressions ? (clicks / impressions) * 100 : numberValue(project.ctr),
    cpc: clicks ? spent / clicks : numberValue(project.cpc),
    cpl: leads ? spent / leads : numberValue(project.cpl),
    cpm: impressions ? (spent / impressions) * 1000 : numberValue(project.cpm),
    romi: spent && hasRevenue ? ((revenue - spent) / spent) * 100 : numberValue(project.romi),
  };
};

const calculateAdPayback = (project, settings = emptySettings()) => {
  const metrics = calculateProjectMetrics(project);
  const budget = numberValue(project.budget || project.spent);
  const observedAverageCheck = numberValue(project.sales) ? numberValue(project.revenue) / numberValue(project.sales) : 0;
  const observedLeadToSaleRate = numberValue(project.leads) ? (numberValue(project.sales) / numberValue(project.leads)) * 100 : 0;
  const averageCheck = numberValue(project.averageCheck) || observedAverageCheck || numberValue(settings.averageCheck);
  const marginRate = normalizePercent(project.marginPercent || settings.marginPercent);
  const expectedCpl = numberValue(project.expectedCpl) || metrics.cpl || numberValue(settings.targetCpl);
  const leadToSaleRate = normalizePercent(project.leadToSaleRate || observedLeadToSaleRate || settings.leadToSaleRate);
  const leads = expectedCpl ? budget / expectedCpl : 0;
  const clients = leads * leadToSaleRate;
  const revenue = clients * averageCheck;
  const grossProfit = revenue * marginRate;
  const netProfit = grossProfit - budget;
  const maxCpl = averageCheck * marginRate * leadToSaleRate;
  const roas = budget ? revenue / budget : 0;
  const romi = budget ? (netProfit / budget) * 100 : 0;

  return {
    averageCheck,
    marginPercent: marginRate * 100,
    leadToSalePercent: leadToSaleRate * 100,
    expectedCpl,
    leads,
    clients,
    revenue,
    grossProfit,
    netProfit,
    maxCpl,
    roas,
    romi,
    hasInputs: budget > 0 && expectedCpl > 0 && averageCheck > 0 && marginRate > 0 && leadToSaleRate > 0,
  };
};

const filledAverage = (items, field) => {
  const values = items.map((item) => numberValue(item[field])).filter((value) => value > 0);
  if (!values.length) return 0;
  return Math.round(values.reduce((sum, value) => sum + value, 0) / values.length);
};

                    <div className="grid gap-2 border-t border-white/10 pt-3">
                      <div className="flex items-center justify-between gap-2 text-xs text-slate-400">
                        <span>Окупаемость</span>
                        <span>ROAS {payback.roas.toFixed(1)}x · ROMI {percent(payback.romi)}</span>
                      </div>
                      <div className="grid grid-cols-2 gap-2 text-xs sm:grid-cols-4">
                        <span className="rounded-lg border border-white/10 px-2 py-1 text-slate-300">Заявки: {Math.round(payback.leads)}</span>
                        <span className="rounded-lg border border-white/10 px-2 py-1 text-slate-300">Клиенты: {payback.clients.toFixed(1)}</span>
                        <span className="rounded-lg border border-white/10 px-2 py-1 text-slate-300">Выручка: {money(payback.revenue)}</span>
                        <span className="rounded-lg border border-white/10 px-2 py-1 text-slate-300">Макс CPL: {money(payback.maxCpl)}</span>
                      </div>
                      <div className={`rounded-lg border px-3 py-2 text-sm ${paybackSignal.tone}`}>{paybackSignal.text}</div>
                    </div>
                  ) : null}
                  <div className={`rounded-lg border px-3 py-2 text-sm ${projectSignal.tone}`}>{projectSignal.text}</div>
                </div>
              </article>
            );
          })
        ) : (
          <EmptyState icon={Target} title="Проектов пока нет" text="Нажми + и создай первую рекламную карточку." />
        )}
      </div>
    </div>
  );

  const renderFinance = () => {
    const monthKey = toISODate(new Date()).slice(0, 7);
    const monthTransactions = data.finance.transactions.filter((item) => item.date?.startsWith(monthKey));
    const monthIncome = monthTransactions.filter((item) => item.type === 'income').reduce((sum, item) => sum + numberValue(item.amount), 0);
    const monthExpenses = monthTransactions.filter((item) => item.type === 'expense').reduce((sum, item) => sum + numberValue(item.amount), 0);
    const settings = { ...emptySettings(), ...(data.settings || {}) };
    const expenseLimit = numberValue(settings.monthlyExpenseLimit);
    const incomeGoal = numberValue(settings.monthlyIncomeGoal);
    const expenseLeft = Math.max(0, expenseLimit - monthExpenses);
    const dailyAllowance = expenseLeft / daysLeftInMonth();
    const incomeProgress = Math.min(100, (monthIncome / Math.max(1, incomeGoal)) * 100);
    const expenseProgress = Math.min(100, (monthExpenses / Math.max(1, expenseLimit)) * 100);
    const categories = Object.entries(
      data.finance.transactions.reduce((acc, item) => {
        if (item.type !== 'expense') return acc;
        acc[item.category] = (acc[item.category] || 0) + numberValue(item.amount);
        return acc;
      }, {}),
    ).sort((a, b) => b[1] - a[1]);

    return (
      <div className="grid gap-5">
        <PanelTitle icon={WalletCards} eyebrow="финансы" title="Финансы" subtitle="Доходы, расходы, категории, цели, остаток и экспорт данных." />

        <div className="grid gap-3 md:grid-cols-4">
          <StatCard icon={CircleDollarSign} label="Доходы" value={money(totals.income)} tone="emerald" />
          <StatCard icon={WalletCards} label="Расходы" value={money(totals.expenses)} tone="rose" />
          <StatCard icon={BarChart3} label="Месячный итог" value={money(monthIncome - monthExpenses)} tone={monthIncome >= monthExpenses ? 'emerald' : 'rose'} />
          <StatCard icon={Gauge} label="Остаток" value={money(totals.balance)} tone={totals.balance >= 0 ? 'cyan' : 'rose'} />
        </div>

        <section className="rounded-lg border border-white/10 bg-white/[0.055] p-3 shadow-glow backdrop-blur">
          <div className="flex flex-wrap gap-2">
            <ActionButton icon={Download} onClick={() => exportDataJson(false)} variant="soft">Экспорт JSON</ActionButton>
            <ActionButton icon={Download} onClick={exportFinanceCsv} variant="soft">CSV</ActionButton>
            <ActionButton icon={Upload} onClick={() => importInputRef.current?.click()} variant="soft">Импорт JSON</ActionButton>
            <ActionButton icon={Save} onClick={() => exportDataJson(true)} variant="green">Сделать резервную копию</ActionButton>
            <ActionButton icon={Gauge} onClick={openSettings} variant="soft">Цели и лимиты</ActionButton>
          </div>
        </section>

        <section className="rounded-lg border border-white/10 bg-white/[0.055] p-4 shadow-glow backdrop-blur">
          <div className="mb-4 flex flex-col gap-1 sm:flex-row sm:items-end sm:justify-between">
            <div>
              <h3 className="text-base font-semibold text-white">План месяца</h3>
              <p className="text-sm text-slate-400">Доход, лимит расходов и безопасный дневной коридор.</p>
            </div>
            <p className="text-sm text-slate-300">До конца месяца: {daysLeftInMonth()} дн.</p>
          </div>
          <div className="grid gap-4 lg:grid-cols-3">
            <div className="rounded-lg border border-white/10 bg-slate-950/55 p-3">
              <div className="mb-2 flex justify-between text-xs text-slate-400"><span>Доход</span><span>{incomeProgress.toFixed(0)}%</span></div>
              <p className="mb-3 text-sm font-semibold text-white">{money(monthIncome)} / {money(incomeGoal)}</p>
              <div className="h-2 overflow-hidden rounded-lg bg-white/10"><div className="h-full rounded-lg bg-emerald-300" style={{ width: `${incomeProgress}%` }} /></div>
            </div>
            <div className="rounded-lg border border-white/10 bg-slate-950/55 p-3">
              <div className="mb-2 flex justify-between text-xs text-slate-400"><span>Расходы</span><span>{expenseProgress.toFixed(0)}%</span></div>
              <p className="mb-3 text-sm font-semibold text-white">{money(monthExpenses)} / {money(expenseLimit)}</p>
              <div className="h-2 overflow-hidden rounded-lg bg-white/10"><div className={`h-full rounded-lg ${expenseProgress > 85 ? 'bg-rose-300' : 'bg-cyan-300'}`} style={{ width: `${expenseProgress}%` }} /></div>
            </div>
            <div className="rounded-lg border border-cyan-300/20 bg-cyan-300/[0.08] p-3">
              <p className="text-xs text-cyan-100/70">Можно тратить в день</p>
              <p className="mt-1 text-2xl font-semibold text-white">{money(dailyAllowance)}</p>
              <p className="mt-2 text-xs text-slate-400">Остаток лимита: {money(expenseLeft)}</p>
            </div>
          </div>
        </section>

        <div className="grid gap-5 xl:grid-cols-[1fr_0.85fr]">
          <section className="rounded-lg border border-white/10 bg-white/[0.055] p-4 shadow-glow backdrop-blur">
            <h3 className="mb-3 text-base font-semibold text-white">Операции</h3>
            <div className="grid gap-2">
              {data.finance.transactions.length ? (
                data.finance.transactions.map((item) => (
                  <article key={item.id} className="flex items-center justify-between gap-3 rounded-lg border border-white/10 bg-slate-950/60 p-3 transition hover:border-white/20">
                    <div className="min-w-0">
                      <p className="truncate text-sm font-semibold text-white">{item.category}</p>
                      <p className="text-xs text-slate-400">{item.date} {item.note ? `· ${item.note}` : ''}</p>
                    </div>
                    <div className="flex shrink-0 items-center gap-2">
                      <p className={`text-sm font-semibold ${item.type === 'income' ? 'text-emerald-200' : 'text-rose-200'}`}>
                        {item.type === 'income' ? '+' : '-'}{money(item.amount)}
                      </p>
                      <button className="grid h-8 w-8 place-items-center rounded-lg border border-white/10 text-slate-200 transition hover:bg-white/10" onClick={() => editTransaction(item)} type="button" aria-label="Редактировать операцию">
                        <Pencil size={14} />
                      </button>
                      <button className="grid h-8 w-8 place-items-center rounded-lg border border-rose-300/20 text-rose-200 transition hover:bg-rose-400/10" onClick={() => deleteTransaction(item.id)} type="button" aria-label="Удалить операцию">
                        <Trash2 size={14} />
                      </button>
                    </div>
                  </article>
                ))
              ) : (
                <EmptyState icon={WalletCards} title="Операций пока нет" text="Нажми + и добавь доход или расход." />
              )}
            </div>
          </section>

          <div className="grid gap-5">
            <section className="rounded-lg border border-white/10 bg-white/[0.055] p-4 shadow-glow backdrop-blur">
              <h3 className="mb-3 text-base font-semibold text-white">Категории расходов</h3>
              <div className="grid gap-2">
                {categories.length ? categories.slice(0, 5).map(([category, amount]) => (
                  <div key={category} className="flex justify-between rounded-lg border border-white/10 bg-slate-950/60 p-3 text-sm">
                    <span className="truncate text-slate-300">{category}</span>
                    <span className="font-semibold text-white">{money(amount)}</span>
                  </div>
                )) : <div className="rounded-lg border border-white/10 bg-slate-950/60 p-3 text-sm text-slate-400">Категорий пока нет.</div>}
              </div>
            </section>

            <section className="rounded-lg border border-white/10 bg-white/[0.055] p-4 shadow-glow backdrop-blur">
              <h3 className="mb-3 text-base font-semibold text-white">Цели</h3>
              <div className="grid gap-3">
                {data.finance.goals.length ? (
                  data.finance.goals.map((goal) => {
                    const progress = Math.min(100, (numberValue(goal.current) / Math.max(1, numberValue(goal.target))) * 100);
                    return (
                      <article key={goal.id} className="rounded-lg border border-white/10 bg-slate-950/60 p-3 transition hover:border-white/20">
                        <div className="mb-2 flex items-center justify-between gap-3">
                          <div className="min-w-0">
                            <p className="truncate text-sm font-semibold text-white">{goal.title}</p>
                            <p className="text-xs text-slate-400">{money(goal.current)} / {money(goal.target)}</p>
                          </div>
                          <button className="grid h-8 w-8 place-items-center rounded-lg border border-rose-300/20 text-rose-200 transition hover:bg-rose-400/10" onClick={() => deleteGoal(goal.id)} type="button" aria-label="Удалить цель">
                            <Trash2 size={14} />
                          </button>
                        </div>
                        <div className="h-2 overflow-hidden rounded-lg bg-white/10"><div className="h-full rounded-lg bg-emerald-300" style={{ width: `${progress}%` }} /></div>
                      </article>
                    );
                  })
                ) : (
                  <EmptyState icon={Target} title="Целей пока нет" text="Цель можно добавить через быстрый ввод." />
                )}
              </div>
            </section>
          </div>
        </div>
      </div>
    );
  };

  const renderHealth = () => {
    const today = toISODate(new Date());
    const health = data.health.find((item) => item.date === today) || makeHealthDay(today, 0);
    const settings = { ...emptySettings(), ...(data.settings || {}) };
    const weeklySteps = data.health.reduce((sum, item) => sum + numberValue(item.steps), 0);
    const weeklyWorkouts = data.health.reduce((sum, item) => sum + numberValue(item.workouts), 0);
    const weeklyStepTarget = numberValue(settings.stepsTarget) * 7;
    const stepProgress = Math.min(100, (weeklySteps / Math.max(1, weeklyStepTarget)) * 100);
    const sleepProgress = Math.min(100, (numberValue(health.sleep) / Math.max(1, numberValue(settings.sleepTarget))) * 100);

    return (
      <div className="grid gap-5">
        <PanelTitle icon={HeartPulse} eyebrow="здоровье" title="Здоровье" subtitle="Быстрый ежедневный чек-ин и компактная история." />

        <div className="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
          <StatCard icon={Moon} label="Сон сегодня" value={`${health.sleep || 0} ч`} tone="cyan" />
          <StatCard icon={Footprints} label="Шаги за неделю" value={weeklySteps.toLocaleString('ru-RU')} tone="emerald" />
          <StatCard icon={Dumbbell} label="Тренировки" value={weeklyWorkouts} tone="rose" />
          <StatCard icon={Activity} label="Энергия / стресс" value={`${health.energy || 0} / ${health.stress || 0}`} tone="amber" />
        </div>

        <section className="rounded-lg border border-white/10 bg-white/[0.055] p-4 shadow-glow backdrop-blur">
          <div className="mb-4 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
            <div>
              <h3 className="text-base font-semibold text-white">Цели здоровья</h3>
              <p className="text-sm text-slate-400">Минимум для энергии, без сложного трекера.</p>
            </div>
            <ActionButton icon={Gauge} onClick={openSettings} variant="soft">Настроить</ActionButton>
          </div>
          <div className="grid gap-4 sm:grid-cols-2">
            <div>
              <div className="mb-1 flex justify-between text-xs text-slate-400"><span>Сон сегодня</span><span>{health.sleep || 0} / {settings.sleepTarget} ч</span></div>
              <div className="h-2 overflow-hidden rounded-lg bg-white/10"><div className="h-full rounded-lg bg-cyan-300" style={{ width: `${sleepProgress}%` }} /></div>
            </div>
            <div>
              <div className="mb-1 flex justify-between text-xs text-slate-400"><span>Шаги за неделю</span><span>{weeklySteps.toLocaleString('ru-RU')} / {weeklyStepTarget.toLocaleString('ru-RU')}</span></div>
              <div className="h-2 overflow-hidden rounded-lg bg-white/10"><div className="h-full rounded-lg bg-emerald-300" style={{ width: `${stepProgress}%` }} /></div>
            </div>
          </div>
        </section>

        <section className="rounded-lg border border-white/10 bg-white/[0.055] p-4 shadow-glow backdrop-blur">
          <h3 className="mb-3 text-base font-semibold text-white">Чек-ин на сегодня</h3>
          <div className="grid gap-3 md:grid-cols-3">
            <Field label="Сон" value={health.sleep} onChange={(value) => updateHealth(today, 'sleep', value)} type="number" step="0.1" />
            <Field label="Вес" value={health.weight} onChange={(value) => updateHealth(today, 'weight', value)} type="number" step="0.1" />
            <Field label="Шаги" value={health.steps} onChange={(value) => updateHealth(today, 'steps', value)} type="number" />
            <label className="flex items-center justify-between rounded-lg border border-white/10 bg-slate-950/70 px-3 py-3 text-sm text-slate-300">
              Тренировка
              <input checked={numberValue(health.workouts) > 0} className="h-4 w-4 accent-cyan-300" onChange={(event) => updateHealth(today, 'workouts', event.target.checked ? 1 : 0)} type="checkbox" />
            </label>
            <Field label="Энергия 1-10" value={health.energy} onChange={(value) => updateHealth(today, 'energy', value)} type="number" min="1" max="10" />
            <Field label="Стресс 1-10" value={health.stress} onChange={(value) => updateHealth(today, 'stress', value)} type="number" min="1" max="10" />
            <div className="md:col-span-3">
              <Field label="Заметка" value={health.notes} onChange={(value) => updateHealth(today, 'notes', value)} as="textarea" placeholder="Коротко о самочувствии" />
            </div>
          </div>
        </section>

        <section className="rounded-lg border border-white/10 bg-white/[0.055] p-4 shadow-glow backdrop-blur">
          <h3 className="mb-3 text-base font-semibold text-white">История</h3>
          <div className="grid gap-2">
            {week.map((day) => {
              const item = data.health.find((entry) => entry.date === day.date) || makeHealthDay(day.date, 0);
              return (
                <article key={day.date} className="grid gap-2 rounded-lg border border-white/10 bg-slate-950/55 p-3 text-sm md:grid-cols-[90px_1fr_auto] md:items-center">
                  <div>
                    <p className="font-semibold uppercase text-white">{day.label}</p>
                    <p className="text-xs text-slate-500">{day.short}</p>
                  </div>
                  <div className="flex flex-wrap gap-2 text-xs text-slate-300">
                    <span className="rounded-lg border border-white/10 px-2 py-1">сон {item.sleep || 0} ч</span>
                    <span className="rounded-lg border border-white/10 px-2 py-1">вес {item.weight || 0} кг</span>
                    <span className="rounded-lg border border-white/10 px-2 py-1">шаги {numberValue(item.steps).toLocaleString('ru-RU')}</span>
                    <span className="rounded-lg border border-white/10 px-2 py-1">энергия {item.energy || 0}/10</span>
                    <span className="rounded-lg border border-white/10 px-2 py-1">стресс {item.stress || 0}/10</span>
                  </div>
                  <span className={`rounded-lg border px-2 py-1 text-xs ${numberValue(item.workouts) > 0 ? 'border-emerald-300/25 bg-emerald-300/10 text-emerald-100' : 'border-white/10 text-slate-500'}`}>
                    {numberValue(item.workouts) > 0 ? 'Тренировка' : 'Без тренировки'}
                  </span>
                </article>
              );
            })}
          </div>
        </section>
      </div>
    );
  };

  const renderContent = () => {
    if (activeSection === 'calendar') return renderCalendar();
    if (activeSection === 'tasks') return renderTasks();
    if (activeSection === 'projects') return renderProjects();
    if (activeSection === 'finance') return renderFinance();
    if (activeSection === 'health') return renderHealth();
    return renderDashboard();
  };

  return (
    <div className="min-h-screen bg-[linear-gradient(180deg,#07090f_0%,#0a111d_45%,#07090f_100%)] text-slate-100">
      <div className="pointer-events-none fixed inset-0 bg-[linear-gradient(rgba(255,255,255,0.025)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.025)_1px,transparent_1px)] bg-[size:48px_48px] opacity-40" />
      <div className="mx-auto flex min-h-screen w-full max-w-[1500px] flex-col lg:flex-row">
        <header className="sticky top-0 z-30 flex items-center justify-between border-b border-white/10 bg-[#0b1018]/95 px-4 py-3 shadow-2xl shadow-black/20 backdrop-blur lg:hidden">
          <div className="flex items-center gap-3">
            <div className="grid h-9 w-9 place-items-center rounded-lg border border-cyan-300/30 bg-cyan-300/10 text-cyan-100">
              <Activity size={19} />
            </div>
            <div>
              <h1 className="text-sm font-semibold text-white">Life Control</h1>
              <p className="text-[11px] text-slate-500">Сегодня</p>
            </div>
          </div>
          <button
            className="grid h-10 w-10 place-items-center rounded-lg bg-cyan-300 text-slate-950 shadow-glow"
            onClick={() => setQuickModal('choose')}
            type="button"
            aria-label="Быстро добавить"
          >
            <Plus size={18} />
          </button>
        </header>

        <aside className="relative z-10 hidden border-b border-white/10 bg-[#0b1018]/90 px-4 py-4 shadow-2xl shadow-black/20 backdrop-blur lg:sticky lg:top-0 lg:block lg:h-screen lg:w-72 lg:border-b-0 lg:border-r">
          <div className="mb-4 flex items-center gap-3 lg:mb-8">
            <div className="grid h-10 w-10 place-items-center rounded-lg border border-cyan-300/30 bg-cyan-300/10 text-cyan-100">
              <Activity size={21} />
            </div>
            <div>
              <h1 className="text-base font-semibold text-white">Life Control</h1>
              <p className="text-xs text-slate-500">Центр управления</p>
            </div>
          </div>

          <nav className="grid gap-2">
            {navItems.map((item) => {
              const Icon = item.icon;
              const selected = activeSection === item.id;

              return (
                <button
                  key={item.id}
                  className={`flex items-center gap-2 rounded-lg border px-3 py-2 text-sm font-medium transition ${
                    selected
                      ? 'border-cyan-300/30 bg-cyan-300/10 text-cyan-100'
                      : 'border-transparent text-slate-400 hover:border-white/10 hover:bg-white/[0.04] hover:text-slate-100'
                  }`}
                  onClick={() => setActiveSection(item.id)}
                  type="button"
                >
                  <Icon size={17} />
                  {item.label}
                </button>
              );
            })}
          </nav>

          <div className="mt-5 hidden rounded-lg border border-white/10 bg-white/[0.045] p-3 lg:block">
            <div className="mb-3 flex items-center gap-2 text-sm font-medium text-white">
              <Zap size={16} className="text-amber-200" />
              Быстрый ввод
            </div>
            <button
              className="flex w-full items-center justify-between rounded-lg border border-cyan-300/25 bg-cyan-300/10 px-3 py-2 text-left text-sm font-medium text-cyan-100 transition hover:bg-cyan-300/15"
              onClick={() => setQuickModal('choose')}
              type="button"
            >
              Добавить запись <Plus size={15} />
            </button>
          </div>

          <div className="mt-6 hidden rounded-lg border border-white/10 bg-white/[0.04] p-3 lg:block">
            <div className="mb-3 flex items-center gap-2 text-sm font-medium text-white">
              <Clock3 size={16} className="text-cyan-200" />
              Неделя
            </div>
            <div className="grid gap-2">
              {week.map((day) => (
                <div key={day.date} className="flex items-center justify-between text-xs">
                  <span className="uppercase text-slate-400">{day.label}</span>
                  <span className="text-slate-500">{day.short}</span>
                </div>
              ))}
            </div>
          </div>
        </aside>

        <main className="relative z-10 flex-1 px-4 pb-28 pt-5 sm:px-6 lg:px-8 lg:py-8">{renderContent()}</main>
      </div>
      <nav className="fixed bottom-0 left-0 right-0 z-30 border-t border-white/10 bg-[#0b1018]/95 px-2 pb-3 pt-2 shadow-2xl shadow-black/30 backdrop-blur lg:hidden">
        <div className="grid grid-cols-6 gap-1">
          {navItems.map((item) => {
            const Icon = item.icon;
            const selected = activeSection === item.id;

            return (
              <button
                key={item.id}
                className={`grid min-h-[54px] place-items-center rounded-lg text-[10px] font-medium transition ${
                  selected ? 'bg-cyan-300/[0.12] text-cyan-100' : 'text-slate-500 hover:bg-white/[0.05] hover:text-slate-200'
                }`}
                onClick={() => setActiveSection(item.id)}
                type="button"
              >
                <Icon size={18} />
                <span className="mt-1">{item.label}</span>
              </button>
            );
          })}
        </div>
      </nav>
      <input ref={importInputRef} className="hidden" type="file" accept="application/json" onChange={importDataJson} />
      {renderQuickModal()}
      {deletedItem ? (
        <div className="fixed bottom-24 left-4 right-4 z-40 mx-auto flex max-w-md items-center justify-between gap-3 rounded-lg border border-cyan-300/20 bg-slate-950/95 px-4 py-3 text-sm text-slate-200 shadow-2xl shadow-black/40 backdrop-blur lg:bottom-6">
          <span>Удалено. Можно отменить.</span>
          <button className="inline-flex items-center gap-2 rounded-lg border border-cyan-300/25 px-3 py-1.5 text-cyan-100 transition hover:bg-cyan-300/10" onClick={undoDelete} type="button">
            <Undo2 size={14} />
            Undo
          </button>
        </div>
      ) : null}
      <Toast message={feedback} />
    </div>
  );
}






createRoot(document.getElementById('root')).render(
  <React.StrictMode>
    <App />
  </React.StrictMode>,
);

    </script>
  </body>
</html>
